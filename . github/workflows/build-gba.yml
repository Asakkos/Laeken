name: Build GBA ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile laeken.gba with devkitARM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            devkitpro/devkitarm:latest \
            make
      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: laeken-gba-rom
          path: laeken.gba
